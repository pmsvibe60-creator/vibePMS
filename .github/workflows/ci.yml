name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: vibepms_finance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finance_test -d vibepms_finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://finance_test:local-test-only@127.0.0.1:5432/vibepms_finance_test
      FINANCE_TEST_DATABASE_URL: postgres://finance_test:local-test-only@127.0.0.1:5432/vibepms_finance_test
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node ../scripts/build-inspection-demo.mjs
      - run: node ../scripts/test-inspection-demo.mjs
      - run: python3 ../scripts/version-site-assets.py
      - run: git diff --exit-code -- ../site/inspection-demo.html ../site/inspection.js ../site/inspection.css
      - run: node ../scripts/build-finance-demo.mjs
      - run: git diff --exit-code -- ../site/finance-engine.js ../site/finance-demo.js
      - run: node ../scripts/test-finance-demo.mjs
      - run: pnpm typecheck
      - run: pnpm test
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --tag vibepms:ci ./sidecar
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner
      - name: Scan working tree
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 dir /repo --redact --no-banner
